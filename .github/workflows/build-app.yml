# Builds the DupeCleaner desktop app on GitHub and uploads it as an
# artifact. The app itself is unsigned: there is no signing identity in
# CI, so macOS users open it with right-click -> Open.
name: Build app

on:
  push:
    branches: [dupecleaner-v1]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
          - os: windows-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: Set up Python 3.12
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install setuptools
          pip install -r requirements.txt -r requirements-extra.txt
      - name: Build C modules, locales and help
        run: |
          python build.py --modules
          python build.py --loc
          python build.py --doc
      - name: Package the app
        run: python package.py
      - name: Zip the macOS app
        if: matrix.os == 'macos-latest'
        run: ditto -c -k --keepParent dist/dupecleaner.app dupecleaner-macos.zip
      - name: Upload macOS app
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: dupecleaner-macos
          path: dupecleaner-macos.zip
      - name: Upload Windows build
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: dupecleaner-windows
          path: dist/
